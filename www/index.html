<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <title>Pustaka Mobile</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="screen active">
        <div class="splash-content">
            <div class="logo">📚</div>
            <h2>Pustaka Mobile</h2>
            <p>Layanan Perpustakaan Digital</p>
        </div>
    </div>

    <!-- 2. HALAMAN LOGIN -->
    <div id="login-screen" class="screen">
        <div class="login-header">
            <h2>Selamat Datang</h2>
            <p>Masuk ke Akun Perpustakaan Anda</p>
        </div>
        <form id="login-form">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="email@contoh.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">MASUK</button>
        </form>
    </div>

    <!-- 3. DASHBOARD / MENU -->
    <div id="main-screen" class="screen">
        <div class="user-header">
            <div class="user-info">
                <img id="user-avatar" src="img/logo.png" alt="Foto Profil">
                <div>
                    <h3 id="user-name">Nama Pengguna</h3>
                    <span id="user-role" class="badge">Role</span>
                </div>
            </div>
            <button id="btn-logout" class="btn-logout">Keluar</button>
        </div>

        <div class="card-membership">
            <p class="card-title">KARTU ANGGOTA DIGITAL</p>
            <h3 id="card-user-name">-</h3>
            <p id="card-user-id">ID: -</p>
        </div>

        <div class="menu-container">
            <p class="section-title">Menu Utama</p>
            <div class="menu-grid">
                <div class="menu-item" onclick="openGuestForm()">
                    <div class="menu-icon">🧾</div>
                    <span>Buku Tamu</span>
                </div>
                <div class="menu-item" onclick="takePhotoAndUpload()">
                    <div class="menu-icon">📷</div>
                    <span>Update Foto</span>
                </div>
                <div class="menu-item">
                    <div class="menu-icon">📖</div>
                    <span>Katalog Buku</span>
                </div>
                <div class="menu-item">
                    <div class="menu-icon">🔄</div>
                    <span>Peminjaman</span>
                </div>
                <div class="menu-item">
                    <div class="menu-icon">🕒</div>
                    <span>Riwayat</span>
                </div>
                <div class="menu-item">
                    <div class="menu-icon">👤</div>
                    <span>Profil Saya</span>
                </div>
                <div class="menu-item">
                    <div class="menu-icon">ℹ️</div>
                    <span>Info Pustaka</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. BUKU TAMU (FORM CHECK-IN) -->
    <div id="guest-screen" class="screen">
        <div class="guest-topbar">
            <button type="button" class="btn-back" onclick="backToMain()">← Kembali</button>
            <h3>Buku Tamu</h3>
        </div>

        <div class="guest-container">
            <p class="guest-staff">Petugas Jaga: <span id="staff-name">-</span></p>

            <form id="guest-form">
                <!-- Foto Tamu -->
                <div class="photo-section">
                    <div class="photo-box" onclick="takeGuestPhoto()">
                        <img id="photo-preview" src="img/logo.png" alt="Foto Tamu">
                    </div>
                    <button type="button" class="btn-secondary" onclick="takeGuestPhoto()">📷 Ambil Foto Tamu</button>
                </div>

                <!-- Identitas Tamu -->
                <div class="input-group">
                    <label>Nama Lengkap Tamu *</label>
                    <input type="text" id="guest-name" placeholder="Nama Tamu" required>
                </div>
                <div class="input-group">
                    <label>No. Telepon / WhatsApp *</label>
                    <input type="tel" id="guest-phone" placeholder="08123456789" required>
                </div>
                <div class="input-group">
                    <label>Instansi / Perusahaan</label>
                    <input type="text" id="guest-company" placeholder="PT / Instansi asal">
                </div>

                <!-- Dropdown dari database -->
                <div class="input-group">
                    <label>Kategori Tamu *</label>
                    <select id="select-category" required></select>
                </div>
                <div class="input-group">
                    <label>Tujuan Kunjungan *</label>
                    <select id="select-purpose" required></select>
                </div>
                <div class="input-group">
                    <label>Lokasi / Ruangan Dituju *</label>
                    <select id="select-location" required></select>
                </div>
                <div class="input-group">
                    <label>Staf yang Ditemui (Host) *</label>
                    <select id="select-host" required></select>
                </div>
                <div class="input-group">
                    <label>Nomor Visitor Badge (Optional)</label>
                    <select id="select-badge">
                        <option value="">-- Tanpa Badge --</option>
                    </select>
                </div>

                <!-- Barang Bawaan / Titipan -->
                <div class="input-group">
                    <label>Barang Titipan / Bawaan (Optional)</label>
                    <input type="text" id="item-name" placeholder="Contoh: Laptop / Tas">
                    <input type="text" id="locker-number" placeholder="Nomor Loker Titipan" style="margin-top: 5px;">
                </div>

                <div class="input-group">
                    <label>Catatan Tambahan</label>
                    <textarea id="guest-notes" rows="3" placeholder="Keterangan tambahan jika ada..."></textarea>
                </div>

                <button type="submit" id="btn-submit" class="btn-primary">PROSES CHECK-IN TAMU</button>
            </form>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
